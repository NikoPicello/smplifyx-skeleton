###############################################################################
# v9 — same as v8 except hand parameters tuned for WiLoR warm-start
#
# Hand changes vs v8:
#   - hand_joints_weights: ramps up (low early to respect WiLoR init,
#     stronger in s2+ where WiLoR-initialized hands can be refined)
#   - hand_pose_prior_weights: much lower (WiLoR anchor does regularization,
#     no need to pull hard toward zero)
#   - wilor_hand_weights: new — dedicated L2 pull toward WiLoR target
#     (requires wilor_hand_weight buffer in SMPLifyLoss)
###############################################################################

dataset: 'custom'
joints_to_ign:
  - 13   # Lknee
  - 14   # Rknee
  - 15   # Lankle
  - 16   # Rankle

joint_conf_threshold: 0.1
hip_weight: 5.0 

data_folder: "samples/Apartment_release_decoration_skeleton_seq131_M1292"
output_folder: "../data/adt_dataset/adt_sequences"
prior_folder: 'priors'
model_folder: 'models'
result_folder: 'results'
gender: "male"
model_type: 'smplx'

use_cuda: True
gpu_id: 1
float_dtype: "float32"

use_joints_conf: False
use_pca: False 
use_hands: True
use_face: True
use_face_contour: True
flat_hand_mean: True 
num_gaussians: 8
body_prior_type: 'l2'
left_hand_prior_type: l2
right_hand_prior_type: l2
jaw_prior_type: 'l2'
focal_length: 5000
num_pca_comps: 45 
rho: 0.05 

interpenetration: True
df_cone_height: 0.0001
ign_part_pairs: ["9,16", "9,17", "6,16", "6,17", "1,2", "12,22"]
penalize_outside: True
max_collisions: 1280

optim_type: 'lbfgsls'
ftol: 1e-9
gtol: 1e-9
lr: 1.1
maxiters: 20
interactive: True
visualize: False
sil_visualize: True

global_orient_mode: 'anchored'   # 'free' | 'frozen' | 'anchored'
global_orient_weight: 0.5     # soft L2 pull toward the init; only used in 'anchored' mode
translation_mode: 'anchored'   # 'free' | 'frozen' | 'anchored'
translation_weight: 15     # soft L2 pull toward the init; only used in 'anchored' mode


# ── weight schedule (identical to v8 except hand terms) ──────────────────────

data_weights:
    - 100
    - 100
    - 100
    - 100
    - 100
    - 75
    - 50 
    - 50
    - 50

body_pose_prior_weights:
    - 1.01  # 4.04e2
    # - 1.01  # 4.04e2
    - 0.574  # 57.4e0
    - 0.0478 # 4.78e0
    - 0.0478  # 4.78e0

# silhouette_weights:
#     - 5
#     - 10
#     - 80
#     - 60
#     - 50

silhouette_weights:
    - 0
    - 0
    - 0
    - 0
    - 0

shape_weights:
  - 100
  - 50
  - 10
  - 5
  - 5
  

coll_loss_weights:
    - 0.
    - 0.
    - 0.
    - 0.01
    - 0.2

# arm_joints_weights:
#     - 10
#     - 8
#     - 6
#     - 4
#     - 5

# Hands: low early, ramp in later stages.
hand_joints_weights:
  - 0.0    # s0: 16 eff
  - 0.1   # s1: 4 eff
  - 0.15   # s2: 4 eff
  - 0.2   # s3: 16 eff
  # - 0.5   # s4: 25 eff

hand_pose_prior_weights:
  # - 0.5
    - 0.3
    - 0.2
    - 0.1
    - 0.05

face_joints_weights:
  # - 0.
    - 0.01
    - 0.05
    - 0.1
    - 0.2

expr_weights:
  - 10
  - 5.0
  - 1.0
  - 0.5
  - 0.5

jaw_pose_prior_weights:
    - 20,20,20
    - 10,10,10
    - 5,5,5
    - 2.5,2.5,2.5
    - 1,1,1

temporal_weights:
    - 1.0  # stage 1 — matches data_weight=100, LBFGS stays near IK trajectory
    - 0.5   # stage 2
    - 0.5   # stage 3 — fine stages weight data more
    - 0.5   # stage 4
    - 0.5   # stage 5

# Lower-body (legs) anchor to the per-frame SMPLer-X init — now restricted to the leg
# DOFs in SMPLifyLoss and kept ON across ALL stages, so the seated legs are not
# straightened by the L2 prior (the legs are otherwise unobserved). Taper the later
# stages if you want the collision term to nudge the legs.
smpler_pose_weights:
    - 30.0
    - 30.0
    - 30.0
    - 30.0
    - 30.0

tracking_iters: 100
tracking_lr: 0.005

ik_niters: 5 
ik_lambda: 1.0
ik_delta_tol: 1.0e-4
ik_temporal_weight: 15.0
lbfgs_rerun_interval: 25


hand_data_weight: 15.0         # keypoints guide gross hand location, not fine finger pose
hand_refine_prior_weight: 0.5 # weak prior — lego task requires non-neutral hand poses
hand_wilor_weight: 0.           # WiLoR pose anchor — disabled (single-view fist bias)


use_vposer: False
vposer_ckpt: "vposer_v1_0"
