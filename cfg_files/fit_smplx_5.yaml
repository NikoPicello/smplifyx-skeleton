###############################################################################
# v5 — fit_smplx_4 baseline + per-frame SMPLer-X body pose prior.
#
# Philosophy: "SMPLer pose regularizes early, data wins late."
#   - smpler_pose_weights: strong early, fast decay — the SMPLer-X per-frame
#     pose seeds plausible structure in the coarse stages, then releases so the
#     skeleton keypoints drive the fine stages.
#   - body_pose_prior_weights: lowered vs v4 mid/late — the SMPLer anchor now
#     supplies the structural regularization that the zero-mean L2 prior used
#     to provide, so we no longer pull as hard toward the rest pose.
#   - everything else identical to v4.
###############################################################################

dataset: 'ADT'
joints_to_ign:
   - 0
   - 13
   - 14
   - 15
   - 16
   - 17
   - 18
   - 19
   - 20

data_folder: "samples/Apartment_release_decoration_skeleton_seq131_M1292"
output_folder: "../data/adt_dataset/adt_sequences"
prior_folder: 'priors'
model_folder: 'models'
result_folder: 'results'
gender: "male"
model_type: 'smplx'

use_cuda: True
gpu_id: 1
float_dtype: "float32"

use_joints_conf: False
use_pca: False
use_hands: True
use_face: True
flat_hand_mean: False
num_gaussians: 8
body_prior_type: 'l2'
left_hand_prior_type: l2
right_hand_prior_type: l2
jaw_prior_type: 'l2'
focal_length: 5000
num_pca_comps: 24
rho: 100

interpenetration: True
df_cone_height: 0.0001
ign_part_pairs: ["9,16", "9,17", "6,16", "6,17", "1,2", "12,22"]
penalize_outside: True
max_collisions: 1280

optim_type: 'lbfgsls'
ftol: 1e-9
gtol: 1e-9
lr: 1.0
maxiters: 20
interactive: True
visualize: False

# ── weight schedule (v4 baseline + SMPLer pose prior) ────────────────────────

data_weights:
    - 90
    - 75
    - 45
    - 25
    - 15

# Lowered mid/late vs v4: the SMPLer per-frame anchor now regularizes pose, so
# we relax the pull toward the zero rest pose and let the data + SMPLer prior
# shape the result.
body_pose_prior_weights:
    - 3.0    # was 4.04
    - 1.0    # was 2.0
    - 0.15   # was 0.3
    - 0.02
    - 0.02

silhouette_weights:
    - 0
    - 0
    - 0
    - 0
    - 0

shape_weights:
    - 0.05
    - 0.025
    - 0.005
    - 0.002
    - 0.002

coll_loss_weights:
    - 0.
    - 0.
    - 0.
    - 0.01
    - 1.0

# Hands: low early, ramp in later stages.
hand_joints_weights:
    - 0.    # s0: 16 eff
    - 0.    # s1: 4 eff
    - 0.    # s2: 4 eff
    - 0.1   # s3: 16 eff
    - 2.0   # s4: 25 eff

hand_pose_prior_weights:
    - 4.04e1  # 4.04e2
    - 4.04e1  # 4.04e2
    - 57.4e-1  # 57.4
    - 4.78e-1  # 4.78
    - 4.78e-1  # 4.78

face_joints_weights:
    - 0.
    - 0.
    - 0.
    - 0.1
    - 2.0

expr_weights:
  - 1.0e2
  - 5.0e1
  - 1.0e1
  - 0.5e1
  - 0.5e1

jaw_pose_prior_weights:
    # First phase
    - 4.04e01,4.04e02,4.04e02
    # Second phase
    - 4.04e01,4.04e02,4.04e02
    # Third phase
    - 5.74,57.40,57.40
    # Fourth phase
    - 0.478,4.78,4.78
    # Fifth phase
    - 0.478,4.78,4.78

tracking_iters: 100
tracking_lr: 0.005

ik_niters: 5
ik_lambda: 1.0
ik_delta_tol: 1.0e-4
ik_temporal_weight: 2.0
lbfgs_rerun_interval: 25

temporal_weights:
    - 100.0  # stage 1
    - 60.0   # stage 2
    - 40.0   # stage 3
    - 40.0   # stage 4
    - 40.0   # stage 5

# SMPLer-X per-frame body pose prior — strong early, fast decay so data wins late.
smpler_pose_weights:
    - 70.0   # stage 2
    - 25.0   # stage 3 — release to the keypoints
    - 8.0    # stage 4
    - 3.0    # stage 5
    - 1.0

cross_temp_weight: 20.0     # fallback if per-person key missing
cross_temp_weight_p0: 10.0  # person 0: stronger anchor (was exploding)
cross_temp_weight_p1: 10.0  # person 1: looser anchor (genuine pose variation)

hand_data_weight: 15.0         # keypoints guide gross hand location, not fine finger pose
hand_refine_prior_weight: 0.5 # weak prior — lego task requires non-neutral hand poses
hand_wilor_weight: 0.           # WiLoR pose anchor — disabled (single-view fist bias)
hand_cross_temp_weight: 5      # previous optimised pose (best per-frame finger reference)


# Direct head/upper-body refinement stage.
direct_data_weight: 18.0      # was default 15 — lean a bit harder on joint data
direct_temporal_weight: 3.0   # was default 2 — slightly stiffer intra-frame anchor

use_vposer: False
vposer_ckpt: "vposer_v1_0"
