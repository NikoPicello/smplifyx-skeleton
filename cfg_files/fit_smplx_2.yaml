###############################################################################
# v9 — same as v8 except hand parameters tuned for WiLoR warm-start
#
# Hand changes vs v8:
#   - hand_joints_weights: ramps up (low early to respect WiLoR init,
#     stronger in s2+ where WiLoR-initialized hands can be refined)
#   - hand_pose_prior_weights: much lower (WiLoR anchor does regularization,
#     no need to pull hard toward zero)
#   - wilor_hand_weights: new — dedicated L2 pull toward WiLoR target
#     (requires wilor_hand_weight buffer in SMPLifyLoss)
###############################################################################

dataset: 'custom'
joints_to_ign:
  # - 11   # Lhip
  # - 12   # Rhip
  - 13   # Lknee
  - 14   # Rknee
  - 15   # Lankle
  - 16   # Rankle


data_folder: "samples/Apartment_release_decoration_skeleton_seq131_M1292"
output_folder: "../data/adt_dataset/adt_sequences"
prior_folder: 'priors'
model_folder: 'models'
result_folder: 'results'
gender: "neutral"
model_type: 'smplx'

use_cuda: True
gpu_id: 1
float_dtype: "float32"

use_joints_conf: False
use_pca: False
use_hands: True
use_face: True
use_face_contour: True
flat_hand_mean: False
num_gaussians: 8
body_prior_type: 'l2'
left_hand_prior_type: l2
right_hand_prior_type: l2
jaw_prior_type: 'l2'
focal_length: 5000
num_pca_comps: 24
rho: 100

interpenetration: True
df_cone_height: 0.0001
ign_part_pairs: ["9,16", "9,17", "6,16", "6,17", "1,2", "12,22"]
penalize_outside: True
max_collisions: 1280

optim_type: 'lbfgsls'
ftol: 1e-9
gtol: 1e-9
lr: 1.0 
maxiters: 10 
interactive: True
visualize: False

# ── weight schedule (identical to v8 except hand terms) ──────────────────────

data_weights:
    - 50
    - 50
    - 50 
    - 50
    - 50

body_pose_prior_weights:
    - 4.04e1  # 4.04e2
    - 4.04e1  # 4.04e2
    - 57.4e-1  # 57.4e0
    - 4.78e-1 # 4.78e0
    - 4.78e-1  # 4.78e0

# silhouette_weights:
#     - 5
#     - 10
#     - 80
#     - 60
#     - 50

silhouette_weights:
    - 0
    - 0
    - 0
    - 0
    - 0

shape_weights:
    - 100
    - 50
    - 10
    - 5
    - 5

coll_loss_weights:
    - 0.
    - 0.
    - 0.
    - 0.01
    - 0.05 

# arm_joints_weights:
#     - 10    # s0: 100 eff
#     - 8     # s1: 25 eff
#     - 6     # s2: 16 eff
#     - 4     # s3: 49 eff
#     - 5     # s4: 100 eff  (was 12 → caused rotation jump

# Hands: low early, ramp in later stages.
hand_joints_weights:
    - 0.    # s0: 16 eff
    - 0.    # s1: 4 eff
    - 0.    # s2: 4 eff
    - 0.1   # s3: 16 eff
    - 0.4   # s4: 25 eff

hand_pose_prior_weights:
    - 4.04e1  # 4.04e2
    - 4.04e1  # 4.04e2
    - 57.4e-1  # 57.4
    - 4.78e-1  # 4.78
    - 4.78e-1  # 4.78

face_joints_weights:
    - 0.
    - 0.
    - 0.
    - 0.1
    - 0.4

#face_weights:
#  - 5.0
#  - 4.0 
#  - 3.0
#  - 2.0
#  - 1.0

expr_weights:
  - 1.0e2
  - 5.0e1
  - 1.0e1
  - 0.5e1
  - 0.5e1

jaw_pose_prior_weights:
    # First phase
    - 4.04e03,4.04e04,4.04e04
    # Second phase
    - 4.04e03,4.04e04,4.04e04
    # Third phase
    - 574,5740,5740
    # Fourth phase
    - 47.8,478,478
    # Fifth phase
    - 47.8,478,478

tracking_iters: 100
tracking_lr: 0.005

ik_niters: 5
ik_lambda: 1.0
ik_delta_tol: 1.0e-4
ik_temporal_weight: 0.
lbfgs_rerun_interval: 25

temporal_weights:
    - 1.0  # stage 1
    - 0.   # stage 2
    - 0.   # stage 3
    - 0.   # stage 4
    - 0.   # stage 5

# SMPLer-X per-frame body pose prior — strong early, fast decay so data wins late.
smpler_pose_weights:
    - 70.0   # stage 2
    - 25.0   # stage 3 — release to the keypoints
    - 8.0    # stage 4
    - 3.0    # stage 5
    - 1.0

# Direct head/upper-body refinement stage.
head_data_weight: 50.0     # was default 15 — lean a bit harder on joint data
head_temporal_weight: 0.   # was default 2 — slightly stiffer intra-frame anchor
head_intra_weight: 0.     # fallback if per-person key missing

hand_data_weight: 50.0         # keypoints guide gross hand location, not fine finger pose
hand_refine_prior_weight: 0.5 # weak prior — lego task requires non-neutral hand poses
hand_wilor_weight: 2.5           # WiLoR pose anchor — disabled (single-view fist bias)
hand_temporal_weight: 0.      # previous optimised pose (best per-frame finger reference)

use_vposer: False
vposer_ckpt: "vposer_v1_0"
