###############################################################################
# temporal_0 — baseline for the windowed (temporal_window.py) fitting pipeline.
#
# Every value below is spelled out explicitly and matches the CURRENT hardcoded
# default in temporal_window.py / cvars.py, so running with this cfg unmodified
# reproduces today's behaviour exactly. It's meant as a frozen reference point:
# copy this file (e.g. temporal_1.yaml) and change only the knob(s) you're
# sweeping, so a diff against this baseline shows exactly what changed.
#
# Any arg you omit entirely falls back to the value hardcoded in
# temporal_window.py/cvars.py directly (cmd_parser.py's own default is None for
# all of them, specifically so there's no second copy of these numbers to drift
# out of sync — see cmd_parser.py's module docstring).
#
# NOTE: data_folder/output_folder/person_id/gender/max_frames below are
# overridden programmatically by fitter_pipeline.py per session/activity/person
# when run that way -- the values here only matter when main.py is invoked
# directly.
###############################################################################

# ── core I/O / run setup ─────────────────────────────────────────────────────
data_folder: "resources/triangulation_results/PLACEHOLDER/lego_task/p0"
output_folder: "resources/fit_results"
max_persons: 2
save_mesh: true
use_cuda: true
gpu_id: 0
dataset: 'custom'
float_dtype: "float32"

# ── SMPL-X model config ──────────────────────────────────────────────────────
model_folder: 'models'
model_type: 'smplx'
gender: 'neutral'
num_betas: 16            # matches mamma's shape space so its betas aren't truncated
use_hands: true
use_face: true
use_face_contour: true
use_pca: false            # full 45-DoF axis-angle hand pose (WiLoR warm-start convention)
num_pca_comps: 45
flat_hand_mean: true
use_vposer: false         # currently unused end-to-end -- kept for compatibility

# ── priors ────────────────────────────────────────────────────────────────────
prior_folder: 'priors'
body_prior_type: 'gmm'
num_gaussians: 8
left_hand_prior_type: 'l2'
right_hand_prior_type: 'l2'
jaw_prior_type: 'l2'
expr_prior_type: 'l2'
shape_prior_type: 'l2'

# ── joint / keypoint handling ────────────────────────────────────────────────
joints_to_ign:
  - 13   # Lknee
  - 14   # Rknee
  - 15   # Lankle
  - 16   # Rankle
joint_conf_threshold: 0.1
hip_weight: 1.0

# ── interpenetration (currently INERT -- built by main.py but not wired into
#    the windowed Stage A/B/C loss; see the earlier discussion in this repo) ──
interpenetration: false
df_cone_height: 0.0001
max_collisions: 1280
point2plane: true
penalize_outside: true
part_segm_fn: ''
ign_part_pairs: null

###############################################################################
# Everything below overrides temporal_window.py's / cvars.py's module constants
# via their configure(args) hook. Values match each module's current default.
###############################################################################

# ── keypoint preprocessing (cvars.py) ────────────────────────────────────────
kp_conf_power: 2.0
kp_fill_max_gap: 3
kp_fill_conf: 0.3
seated_hip_x: -1.1
seated_knee_x: 1.3

# ── window geometry ───────────────────────────────────────────────────────────
win_size: 64
win_overlap: 16 

# ── temporal smoothness (Stage A) ────────────────────────────────────────────
lambda_vel_bp: 20.0
lambda_acc_bp: 70.0
lambda_vel_tr: 60.0
lambda_acc_tr: 120.0
lambda_vel_go: 60.0
lambda_acc_go: 350.0

# ── anchors (Stage A) ─────────────────────────────────────────────────────────
lambda_root: 400.0
lambda_bnd: 1000.0
lambda_go_anchor: 20.0
lambda_bp_still: 15.0
lambda_cerv: 0.1

# ── data term / priors (Stage A) ──────────────────────────────────────────────
data_rho: 0.25
lambda_pose: 0.5
lambda_angle: 0.3

# ── coarse-to-fine stage schedule (Stage A) ──────────────────────────────────
stage_data_weights:     [100.0, 150.0, 200.0]
stage_temporal_weights: [2.0, 1.0, 0.5]
stage_lbfgs_steps:      [10, 10, 10]

# ── Stage 0: betas refinement (bone-length fit) ──────────────────────────────
betas_steps: 3
betas_nsat: 50
betas_len_w: 1000.0
betas_rho0: 0.15
betas_rho1: 0.03
betas_anchor_w: 0.05
betas_null_w: 5.0
betas_conf_thr: 0.1

# ── static root solve ─────────────────────────────────────────────────────────
solve_static_root: true
freeze_root: false
root_stride: 30
root_frame_count: 25
root_data_w: 100.0
root_conf_floor: 0.3
root_steps: 3
root_go_anchor_w: 3.0
root_tr_anchor_w: 3.0
root_refit: true
root_refit_thr_mm: 5.0
root_refit_thr_deg: 0.5

# ── Stage B: hands ────────────────────────────────────────────────────────────
hand_data_w: 50.0
hand_wilor_w: 0.8
hand_prior_w: 0.1
hand_arm_anchor: 0.5
hand_steps: 15
hand_place_steps: 0

# ── Stage B: head ─────────────────────────────────────────────────────────────
head_face_w: 60.0
head_jaw_w: 1.0
head_pose_w: 0.1
head_anchor: 0.1
head_expr_w: 1.0
head_eye_w: 1.0
head_ear_rho: 0.02
head_steps: 25

# ── legs ──────────────────────────────────────────────────────────────────────
freeze_legs: true
leg_pose_cam: 'GB'

# ── Stage C: whole-sequence smoothing ─────────────────────────────────────────
smooth_lam_bp: 50.0
smooth_lam_leg: 1000.0
smooth_lam_go: 200.0
smooth_lam_tr: 200.0
smooth_lam_hand: 20.0
smooth_lam_head: 20.0

# ── misc ──────────────────────────────────────────────────────────────────────
term_cap: 100000.0
log_every: 50
