# Example sweep: vary the direct head/upper-body refinement and compare.
#
#   python run_sweep.py --sweep cfg_files/sweep_example.yaml --gpus 0,1,2,3 --per-gpu 2
#   python run_sweep.py --sweep cfg_files/sweep_example.yaml --dry-run   # preview only
#
# Each variant inherits everything from `base` and overrides only the listed keys.
# direct_refine_joints is a single set, shared by both persons.
# Output for variant <name> goes to: resources/fit_results/<session>_cfg<name>/...
# and the resolved config is saved there as config_used.yaml.

base: cfg_files/fit_smplx_9.yaml
name: head_dof_sweep

variants:
  # Freeze the head stage entirely (baseline to compare against).
  no_head_refine:
    apply_head_refinement: false

  # Only let the neck move.
  free_neck:
    direct_refine_joints: [neck]

  # Neck + spine so the torso follows head refinement (no stretched neck).
  neck_spine:
    direct_refine_joints: [neck, spine3, spine1]

  # Full upper-body chain incl. arms.
  neck_spine_arms:
    direct_refine_joints: [neck, spine3, spine1, left_collar, right_collar, left_shoulder, right_shoulder, left_elbow, right_elbow]

# Optional: crossed with every variant above (here: 2 -> doubles the run count).
# Comment out to keep just the variants.
grid:
  direct_temporal_weight: [2.0, 6.0]
