###############################################################################
# v4 — fit_smplx_3 pushed further along the "trust the data" trajectory.
#
# vs v3:
#   - data_weights: more front-loaded, faster late decay (90..15 vs 70..30)
#   - body_pose_prior_weights: lower mid/late (let later stages fit the skeleton)
#   - shape_weights: halved (betas already seeded from SMPLer-X)
#   - ik_temporal_weight: 15 -> 10 (slightly looser IK temporal anchor)
#   - temporal_weights: softer late stages
#   - direct_*: lean a bit harder on data + temporal in the head-refine stage
###############################################################################

dataset: 'ADT'
joints_to_ign:
   - 0 
   - 13
   - 14
   - 15
   - 16
   - 17
   - 18
   - 19
   - 20

data_folder: "samples/Apartment_release_decoration_skeleton_seq131_M1292"
output_folder: "../data/adt_dataset/adt_sequences"
prior_folder: 'priors'
model_folder: 'models'
result_folder: 'results'
gender: "male"
model_type: 'smplx'

use_cuda: True
gpu_id: 1
float_dtype: "float32"

use_joints_conf: False
use_pca: False
use_hands: True
use_face: True
flat_hand_mean: False
num_gaussians: 8
body_prior_type: 'l2'
left_hand_prior_type: l2
right_hand_prior_type: l2
jaw_prior_type: 'l2'
focal_length: 5000
num_pca_comps: 24
rho: 100

interpenetration: True
df_cone_height: 0.0001
ign_part_pairs: ["9,16", "9,17", "6,16", "6,17", "1,2", "12,22"]
penalize_outside: True
max_collisions: 1280

optim_type: 'lbfgsls'
ftol: 1e-9
gtol: 1e-9
lr: 1.0 
maxiters: 20
interactive: True
visualize: False

# ── weight schedule (identical to v8 except hand terms) ──────────────────────

data_weights:
    - 90
    - 75
    - 45
    - 25
    - 15

body_pose_prior_weights:
    - 4.04   # keep early structure
    - 2.0    # lower mid (was 4.04)
    - 0.3    # was 0.574
    - 0.02   # was 0.0478
    - 0.02   # was 0.0478

# silhouette_weights:
#     - 5
#     - 10
#     - 80
#     - 60
#     - 50

silhouette_weights:
    - 0
    - 0
    - 0
    - 0
    - 0

shape_weights:
    - 0.5
    - 0.25
    - 0.05
    - 0.02
    - 0.02

coll_loss_weights:
    - 0.
    - 0.
    - 0.
    - 0.01
    - 1.0

# arm_joints_weights:
#     - 10
#     - 8
#     - 6
#     - 4
#     - 5

# Hands: low early, ramp in later stages.
hand_joints_weights:
    - 0.    # s0: 16 eff
    - 0.    # s1: 4 eff
    - 0.    # s2: 4 eff
    - 0.1   # s3: 16 eff
    - 2.0   # s4: 25 eff

hand_pose_prior_weights:
    - 4.04e1  # 4.04e2
    - 4.04e1  # 4.04e2
    - 57.4e-1  # 57.4
    - 4.78e-1  # 4.78
    - 4.78e-1  # 4.78

face_joints_weights:
    - 0.
    - 0.
    - 0.
    - 0.1
    - 2.0

#face_weights:
#  - 5.0
#  - 4.0 
#  - 3.0
#  - 2.0
#  - 1.0

expr_weights:
  - 1.0e2
  - 5.0e1
  - 1.0e1
  - 0.5e1
  - 0.5e1

jaw_pose_prior_weights:
    # First phase
    - 4.04e03,4.04e04,4.04e04
    # Second phase
    - 4.04e03,4.04e04,4.04e04
    # Third phase
    - 574,5740,5740
    # Fourth phase
    - 47.8,478,478
    # Fifth phase
    - 47.8,478,478

tracking_iters: 100
tracking_lr: 0.005

ik_niters: 5 
ik_lambda: 1.0
ik_delta_tol: 1.0e-4
ik_temporal_weight: 10.0
lbfgs_rerun_interval: 25

temporal_weights:
    - 100.0  # stage 1
    - 60.0   # stage 2
    - 40.0   # stage 3
    - 40.0   # stage 4
    - 40.0   # stage 5

cross_temp_weight: 20.0     # fallback if per-person key missing
cross_temp_weight_p0: 10.0  # person 0: stronger anchor (was exploding)
cross_temp_weight_p1: 10.0  # person 1: looser anchor (genuine pose variation)

hand_data_weight: 15.0         # keypoints guide gross hand location, not fine finger pose
hand_refine_prior_weight: 0.5 # weak prior — lego task requires non-neutral hand poses
hand_wilor_weight: 0.           # WiLoR pose anchor — disabled (single-view fist bias)
hand_cross_temp_weight: 5      # previous optimised pose (best per-frame finger reference)


# Direct head/upper-body refinement stage.
# direct_refine_joints is left unset so the sweep variants control it.
direct_data_weight: 18.0      # was default 15 — lean a bit harder on joint data
direct_temporal_weight: 3.0   # was default 2 — slightly stiffer intra-frame anchor

use_vposer: False
vposer_ckpt: "vposer_v1_0"
